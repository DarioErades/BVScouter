<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: local-video:; media-src 'self' local-video:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self';">
    <title>BVScouter - Análisis Profesional de Voleibol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <!-- Pantalla de selección de modalidad -->
    <div id="mode-selector"></div>

    <!-- App principal (se oculta hasta elegir modo) -->
    <div id="app" style="display: none;">
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-logo">
                <div style="display:flex; align-items:center; gap: 12px; flex:1;" class="logo-container">
                    <span class="logo-icon">🏐</span>
                    <span class="logo-text">BVScouter</span>
                </div>
                <button id="btn-toggle-sidebar" title="Ocultar/Mostrar menú" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:24px; padding: 0 4px; line-height: 1;">≡</button>
            </div>
            <ul class="sidebar-nav" id="sidebar-nav-items">
                <!-- se rellena dinámicamente según el modo -->
            </ul>
            <div class="sidebar-footer">
                <button id="btn-cambiar-modo" class="btn-back-to-selector">
                    <span>←</span> <span class="nav-label">Cambiar Modalidad</span>
                </button>
                <a href="#" id="settings-link" data-page="ajustes" class="nav-link"><span class="nav-icon">⚙️</span> <span class="nav-label">Ajustes</span></a>
                <p class="version">v1.1.0</p>
            </div>
        </nav>
        <main id="content" class="content">
            <!-- las páginas se cargan aquí -->
        </main>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="/src/renderer.js"></script>
</body>
</html>
